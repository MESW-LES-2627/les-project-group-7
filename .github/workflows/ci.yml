name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: Lint, Types, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Lint (next lint)
        run: npm run lint

      - name: Knip (unused dependencies & exports)
        run: npm run knip

      - name: Unit & Component tests with coverage
        run: npm run test:coverage

      - name: Build Next.js application
        run: npm run build

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations on Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripbook_test
        run: npx prisma migrate deploy

      - name: Seed database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripbook_test
        run: npm run seed

      - name: Run API integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tripbook_test
        run: npm run test:integration
