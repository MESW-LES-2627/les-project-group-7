services:
  db:
    image: postgres:18-alpine
    container_name: les_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: les_db
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep the data in /var/lib/postgresql/18/docker, so the volume is
      # mounted one level up. A new volume name keeps the old PostgreSQL 16 data out of the way.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d les_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata18:
